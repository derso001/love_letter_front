<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Листівочка ❤️</title>
        <link rel="stylesheet" href="css/index-style.css">
    </head>
    <body>
        <div class="main-div">
            <img src="assets/images/heart.jpg" alt="Серце" class="heart-icon">
            
            <h1>Введи пароль для початку</h1>
            
            <p>Ну це якась дата</p>
            
            <form id="password-form" onsubmit="return false;">
                
                <input type="text" id="password-input" placeholder="Введи код" autocomplete="off">
                
                <button type="button" id="login-btn">Відкрити</button>
            
            </form>
            
            <p id="error-message" class="error-text"></p>
        </div>

        <script src="js/heart-animation.js"></script>
    </body>
</html>
