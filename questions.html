<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наші 36 Питань ❤️</title>

    <!-- Підключаємо твій основний файл стилів (там вже є дизайн менюшки) -->
    <link rel="stylesheet" href="css/style.css"> 
    <style>
        /* Додаткові стилі ТІЛЬКИ для карток з питаннями */
        .questions-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }
        .question-box {
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-left: 6px solid #e91e63;
        }
        .question-title {
            font-size: 1.2em;
            color: #e91e63;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: bold;
            font-family: 'Open Sans', sans-serif;
        }
        .answer-box {
            margin-bottom: 12px;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.95em;
        }
        .answer-box.boris {
            background-color: #f0f0f0; 
            border-left: 4px solid #ccc;
        }
        .answer-box.vika {
            background-color: #ffe6ea;
            border-left: 4px solid #ff4d6d;
        }
        .author-name {
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #555;
        }
        .empty-message {
            text-align: center;
            color: #888;
            font-style: italic;
            margin-top: 40px;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>

    <!-- ТВОЯ ОРИГІНАЛЬНА НАВІГАЦІЯ (Тут тепер три кнопки, ця сторінка - активна) -->
    <nav class="side-nav">
        <a href="galeri.html" class="nav-square" title="Галерея">🖼️</a>
        <a href="wish.html" class="nav-square" title="Список бажань">🎁</a>
        <a href="questions.html" class="nav-square active" title="36 питань">💌</a>
    </nav>

    <!-- Твій блок для анімації сердечок -->
    <div class="love-canvas" id="love-canvas"></div>

    <!-- Твій фірмовий напівпрозорий контейнер -->
    <div class="content-wrapper">
        
        <header>
            <h1>Наші 36 Питань</h1>
        </header>

        <main>
            <section class="intro-message">
                <p>Тут зібрані наші відверті відповіді. Питання з'являтиметься на цій сторінці лише після того, як ми обидва збережемо свої думки в боті.</p>
                <hr>
            </section>

            <!-- Контейнер, куди JS буде вставляти питання -->
            <div id="questions-container" class="questions-list">
                <div class="empty-message">Завантажую наші відповіді... ⏳</div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Наші Спогади. Всі права належать нам обом. ❤️</p>
        </footer>
    </div>

    <!-- Підключаємо логіку завантаження питань та твої сердечка -->
    <script src="js/questions.js"></script>
    <script src="js/heart-animation.js"></script> 
</body>
</html>
